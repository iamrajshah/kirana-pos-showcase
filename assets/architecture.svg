    <rect x="60" y="160" width="210" height="240" rx="20" fill="#fff"/><text x="90" y="205" class="t h">Store team</text><text x="90" y="245" class="t" font-size="28">◉</text><text x="130" y="245" class="p">Owner</text><text x="90" y="295" class="t" font-size="28">◉</text><text x="130" y="295" class="p">Manager</text><text x="90" y="345" class="t" font-size="28">◉</text><text x="130" y="345" class="p">Cashier</text>
    <rect x="340" y="125" width="290" height="310" rx="20" fill="#fff"/><rect x="340" y="125" width="290" height="62" rx="20" fill="#0ea5e9"/><path d="M340 165h290v22H340z" fill="#0ea5e9"/><text x="370" y="164" fill="#fff" font-family="Inter,Segoe UI,Arial" font-size="20" font-weight="750">Ionic React client</text><text x="375" y="228" class="t h">Feature screens</text><text x="375" y="257" class="p">Billing · stock · ledgers · reports</text><rect x="370" y="286" width="230" height="64" rx="13" fill="#eff6ff"/><text x="392" y="315" class="t" font-size="16" font-weight="700">Redux Toolkit</text><text x="392" y="337" class="p">auth + cached application state</text><rect x="370" y="366" width="230" height="43" rx="13" fill="#ecfeff"/><text x="392" y="393" class="t" font-size="15" font-weight="700">Capacitor native bridge</text>
    <rect x="700" y="125" width="270" height="310" rx="20" fill="#fff"/><rect x="700" y="125" width="270" height="62" rx="20" fill="#334155"/><path d="M700 165h270v22H700z" fill="#334155"/><text x="730" y="164" fill="#fff" font-family="Inter,Segoe UI,Arial" font-size="20" font-weight="750">Private REST API</text><text x="735" y="228" class="t h">Application boundary</text><text x="735" y="260" class="p">JWT + refresh</text><text x="735" y="291" class="p">Role authorization</text><text x="735" y="322" class="p">Transactional rules</text><text x="735" y="353" class="p">Idempotent operations</text><text x="735" y="384" class="p">Validation + auditability</text>
    <rect x="1040" y="125" width="300" height="310" rx="20" fill="#fff"/><text x="1075" y="175" class="t h">Business services</text><rect x="1075" y="205" width="230" height="52" rx="12" fill="#ecfdf5"/><text x="1100" y="237" class="t" font-size="15" font-weight="700">Relational data store</text><rect x="1075" y="274" width="230" height="52" rx="12" fill="#fff7ed"/><text x="1100" y="306" class="t" font-size="15" font-weight="700">Reporting queries</text><rect x="1075" y="343" width="230" height="52" rx="12" fill="#f5f3ff"/><text x="1100" y="375" class="t" font-size="15" font-weight="700">Deployment + monitoring</text>
