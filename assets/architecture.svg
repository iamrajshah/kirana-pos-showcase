<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">Kirana POS architecture</title><desc id="desc">A layered diagram showing users, Ionic React clients, Redux and RTK Query, a private API, and data services.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#e0f2fe"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".12"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><style>.t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}.h{font-weight:750;font-size:19px}.p{font-size:14px;fill:#475569}.arrow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1400" height="560" rx="24" fill="url(#bg)"/><text x="60" y="62" class="t" font-size="28" font-weight="800">Kirana POS · system view</text><text x="60" y="91" class="p">Public client architecture; backend implementation and operational data remain private.</text>
